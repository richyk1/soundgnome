<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- PWA Meta Tags -->
    <!-- Note: manifest link is auto-injected by vite-plugin-pwa (manifest.webmanifest) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Soundgnome - Personal music library manager" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Soundgnome" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Theme before first paint (light 07:00–19:00); src/lib/theme.svelte.ts keeps it current.
      { const hour = new Date().getHours(); document.documentElement.dataset.theme = hour >= 7 && hour < 19 ? 'light' : 'dark'; }
    </script>

    <!-- Geist (interface) + Geist Mono (data and measurements) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
    
    <title>Soundgnome</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
