[package]
name = "tagger"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
config = { path = "../config" }
fetcher = { path = "../fetcher" }

tracing = { workspace = true }

id3 = "1.16.2"
metaflac = "0.2.8"
mp4ameta = "0.11.0"
# Ogg Vorbis is the one container the others cannot tag, and it is what
# Spotify audio arrives as.
lofty = "0.22"
chrono = "0.4.39"
musicbrainz_rs = "0.9.0"
bandcamp = "0.3.4"
# Downscale embedded artwork to small list thumbnails; decode jpeg/png/webp,
# encode jpeg. default-features off keeps the format set minimal.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
lofty = "0.22"
