[package]
name = "fetcher"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
config = { path = "../config" }
ai = { path = "../ai" }

tracing = { workspace = true }

chrono = "0.4.39"
rustypipe = "0.11.4"
rsoundcloud = { version = "0.2.6" }
# rsoundcloud = { path = "../../../rsoundcloud" } # for local testing purposes

tokio = { version = "1.44.2", features = ["sync"] }
futures = "0.3.31"
async-trait = "0.1.88"
fancy-regex = "0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "socks", "rustls-tls"] }
